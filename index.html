<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>평가계획서 AI 검토 시스템</title>
  
  <!-- PDF 텍스트 추출 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- HWPX 텍스트 추출 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background-color: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { font-weight: bold; color: #34495e; display: block; margin-bottom: 8px; }
    input[type="password"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size:15px; }
    button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background-color: #2980b9; }
    button:disabled { background-color: #95a5a6; cursor: not-allowed; }
    .status { margin-top: 20px; text-align: center; font-weight: bold; color: #e67e22; }
    .result-box { margin-top: 20px; padding: 20px; border: 1px solid #dcdde1; border-radius: 5px; background-color: #f9fbfd; min-height: 150px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; display: none; }
    .security-notice { font-size: 12px; color: #27ae60; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📄 평가계획서 AI 자동 검토</h1>
    <p class="subtitle">학교 규정에 맞게 작성되었는지 AI가 안전하게 확인합니다.</p>

    <div class="form-group">
      <label for="school-password">🔒 접속 비밀번호</label>
      <input type="password" id="school-password" placeholder="업무 메신저로 안내받은 비밀번호 입력">
    </div>

    <div class="form-group">
      <label for="file-upload">📁 파일 업로드 (PDF 또는 HWPX)</label>
      <input type="file" id="file-upload" accept=".pdf, .hwpx">
      <div class="security-notice">※ 업로드하신 문서 원본은 외부로 전송되거나 서버에 저장되지 않습니다.</div>
    </div>

    <button id="submit-btn" onclick="processFile()">AI 검토 시작하기</button>

    <div id="status" class="status"></div>
    <div id="result-box" class="result-box"></div>
  </div>

  <script>
    // PDF.js 워커 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // 서버에 비밀번호 확인을 요청하는 함수
    function checkPasswordServer(inputPwd) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve) 
          .withFailureHandler(reject)
          .verifyPassword(inputPwd);
      });
    }

    async function processFile() {
      const pwdInput = document.getElementById('school-password').value;
      const fileInput = document.getElementById('file-upload');
      const statusDiv = document.getElementById('status');
      const resultBox = document.getElementById('result-box');
      const submitBtn = document.getElementById('submit-btn');

      if (!pwdInput) {
        alert("비밀번호를 입력해주세요."); return;
      }
      if (fileInput.files.length === 0) {
        alert("검토할 평가계획서 파일을 선택해주세요."); return;
      }

      // UI 초기화
      submitBtn.disabled = true;
      resultBox.style.display = "none";
      resultBox.innerText = "";
      statusDiv.innerText = "비밀번호 확인 중...";

      try {
        // 1. 서버에 비밀번호 확인 요청
        const isPwdCorrect = await checkPasswordServer(pwdInput);
        if (!isPwdCorrect) {
          alert("비밀번호가 틀렸습니다. 업무 메신저를 확인해주세요.");
          statusDiv.innerText = "";
          submitBtn.disabled = false;
          return; // 실패 시 중단
        }

        const file = fileInput.files[0];
        const fileName = file.name.toLowerCase();
        let extractedText = "";

        // 2. 브라우저 내부에서 텍스트 추출
        if (fileName.endsWith('.pdf')) {
          statusDiv.innerText = "⏳ PDF 파일 분석 중... (로컬 처리)";
          extractedText = await extractTextFromPDF(file);
        } 
        else if (fileName.endsWith('.hwpx')) {
          statusDiv.innerText = "⏳ HWPX 파일 분석 중... (로컬 처리)";
          extractedText = await extractTextFromHWPX(file);
        } 
        else {
          alert("지원하지 않는 파일 형식입니다. PDF 또는 HWPX 파일만 올려주세요.");
          submitBtn.disabled = false;
          statusDiv.innerText = "";
          return;
        }

        if (!extractedText.trim()) {
          throw new Error("문서에서 텍스트를 찾을 수 없습니다. 이미지(스캔본) 파일인지 확인해주세요.");
        }

        // 3. 서버(AI)로 텍스트와 파일명 전송
        statusDiv.innerText = "🤖 AI가 학교 규정과 비교하여 검토 중입니다... (약 30초~1분 소요)";
        
        google.script.run
          .withSuccessHandler(function(result) {
            statusDiv.innerText = "✅ 검토가 완료되었습니다!";
            resultBox.innerText = result;
            resultBox.style.display = "block";
            submitBtn.disabled = false;
          })
          .withFailureHandler(function(error) {
            statusDiv.innerText = "❌ 오류가 발생했습니다.";
            alert("서버 오류: " + error.message);
            submitBtn.disabled = false;
          })
          .callOpenAI(extractedText, file.name);

      } catch (error) {
        statusDiv.innerText = "❌ 처리 중 오류가 발생했습니다.";
        alert(error.message);
        submitBtn.disabled = false;
      }
    }

    // --- PDF 텍스트 추출 함수 ---
    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";
      
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        fullText += pageText + "\n";
      }
      return fullText;
    }

    // --- HWPX 텍스트 추출 함수 ---
    async function extractTextFromHWPX(file) {
      const arrayBuffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(arrayBuffer);
      let fullText = "";
      
      for (const relativePath in zip.files) {
        if (relativePath.startsWith("Contents/section") && relativePath.endsWith(".xml")) {
          const xmlText = await zip.files[relativePath].async("text");
          const cleanText = xmlText.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
          fullText += cleanText + "\n";
        }
      }
      return fullText;
    }
  </script>
</body>
</html>
